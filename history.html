<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View images and cookie recipes generated during this server session." />
    <title>Recent creations - Image to Cookie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/recipe.js" defer></script>
    <script src="/history.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Image to Cookie home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none">
            <rect x="3.5" y="3.5" width="21" height="21" rx="6" stroke="currentColor" stroke-width="2" />
            <circle cx="10" cy="10" r="2.25" fill="currentColor" />
            <path d="m5.5 20 6.2-5.8a2 2 0 0 1 2.8.1l2 2 1.3-1.2a2 2 0 0 1 2.8.1l3.9 3.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </span>
        <span>frame<span class="brand-period">.</span></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav-link" href="/">Create</a>
        <a class="site-nav-link site-nav-link-active" href="/history" aria-current="page">History</a>
      </nav>
    </header>

    <main class="history-main">
      <div class="history-title-row">
        <div>
          <p class="history-eyebrow"><span class="eyebrow-line"></span> Fresh from this session</p>
          <h1>Recent <span>creations.</span></h1>
          <p class="history-intro">Images and recipes generated since this server was started.</p>
        </div>
        <a class="new-image-link" href="/">Create a cookie <span aria-hidden="true">↗</span></a>
      </div>

      <p class="history-message" id="history-message" role="status" aria-live="polite">Loading your creations…</p>
      <div class="history-grid" id="history-grid"></div>
    </main>
  </body>
</html>
